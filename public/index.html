<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twisted Isle Panel</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="login" class="card login-card" hidden>
    <h1>Twisted Isle</h1><p>Sign in with Discord to access the administration panel.</p>
    <a class="btn primary" href="/auth/discord">Login with Discord</a>
    <p id="login-error" class="text-warning"></p>
  </div>
  <div id="app" class="container" hidden>
    <aside class="sidebar">
      <div class="logo">Twisted Isle</div><div class="logo-sub">The Isle Evrima Panel</div>
      <nav aria-label="Main navigation">
        <div class="nav-section"><div class="nav-label">Main</div>
          <a class="nav-link" data-route="/dashboard" href="/dashboard">Dashboard</a>
          <a class="nav-link" data-route="/server" href="/server">Server</a>
          <a class="nav-link" data-route="/players" href="/players">Players</a>
          <a class="nav-link" data-route="/logs" href="/logs">Logs</a>
        </div>
        <div class="nav-section"><div class="nav-label">Admin</div>
          <a class="nav-link" data-route="/commands" href="/commands">Commands</a>
          <a class="nav-link" data-route="/rcon" href="/rcon">RCON</a>
          <a class="nav-link" data-route="/config" href="/config">Config</a>
          <a class="nav-link" data-route="/discord" href="/discord">Discord</a>
        </div>
      </nav>
      <div class="user-section"><div class="user-info"><img id="user-avatar" class="user-avatar" alt="Avatar" /><div class="user-details"><div id="user-name" class="user-name"></div><div id="user-role" class="user-role"></div></div></div><button id="logout" class="logout-btn">Logout</button></div>
    </aside>
    <main class="main"><header class="header"><div><div id="page-title" class="page-title"></div><div id="page-subtitle" class="page-subtitle"></div></div><div id="server-status" class="status"><span class="status-dot"></span><span>Checking server...</span></div></header><div id="view"></div></main>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
